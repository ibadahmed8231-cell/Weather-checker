<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyCast Weather</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#4facfe;--bg2:#00c6ff;--card:rgba(255,255,255,.16);--line:rgba(255,255,255,.28);--fg:#fff;--muted:rgba(255,255,255,.78)}
:root[data-theme="night"]{--bg1:#0f2027;--bg2:#2c5364}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);
background:linear-gradient(135deg,var(--bg1),var(--bg2));transition:background 1s ease;overflow-x:hidden}
.wrap{max-width:480px;margin:auto;padding:24px 20px 60px}
.searchbar{display:flex;gap:8px;margin-bottom:22px}
.searchbar input{flex:1;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.searchbar input::placeholder{color:var(--muted)}
.searchbar button{padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chips button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:.85rem;cursor:pointer}
.chips button.active{background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 24px;text-align:center;backdrop-filter:blur(14px);position:relative;overflow:hidden}
.city{font-size:1.4rem;font-weight:600;margin:0}
.date{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
#icon{width:110px;height:110px;margin:10px auto}
.temp{font-size:4rem;font-weight:700;margin:0;line-height:1}
.desc{color:var(--muted);text-transform:capitalize;margin:4px 0 22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 6px}
.stat b{display:block;font-size:1.1rem}
.stat span{color:var(--muted);font-size:.75rem}
.forecast{display:flex;gap:10px;overflow-x:auto;margin-top:22px;padding-bottom:4px}
.fday{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:center;min-width:66px}
.fday span{display:block;font-size:.78rem;color:var(--muted)}
.fday svg{width:34px;height:34px;margin:4px 0}
.fday b{font-size:.9rem}
.drop,.flake{position:absolute;background:rgba(255,255,255,.5);border-radius:2px;pointer-events:none}
.flake{background:#fff;border-radius:50%}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="searchbar">
    <input id="q" placeholder="Search a city (try Riyadh, Tokyo, London...)" autocomplete="off">
    <button id="go">Search</button>
  </div>
  <div class="chips" id="chips"></div>

  <div class="card" id="card">
    <div id="fx" style="position:absolute;inset:0;pointer-events:none"></div>
    <p class="date" id="date"></p>
    <h1 class="city" id="city">Riyadh</h1>
    <div id="icon"></div>
    <p class="temp" id="temp">—</p>
    <p class="desc" id="desc">—</p>
    <div class="grid">
      <div class="stat"><b id="feels">—</b><span>Feels like</span></div>
      <div class="stat"><b id="hum">—</b><span>Humidity</span></div>
      <div class="stat"><b id="wind">—</b><span>Wind</span></div>
    </div>
  </div>

  <div class="forecast" id="forecast"></div>
  <footer>Demo data for a fixed set of cities · SkyCast</footer>
</div>

<script>
// ---- Demo dataset (stands in for a live weather API) ----
var DATA = {
  riyadh:  {name:"Riyadh, SA",   cond:"sunny",   temp:38, feels:41, hum:14, wind:11, f:[39,40,37,35,38,41,39]},
  tokyo:   {name:"Tokyo, JP",    cond:"cloudy",  temp:22, feels:22, hum:58, wind:14, f:[21,23,22,20,19,22,24]},
  london:  {name:"London, UK",   cond:"rain",    temp:14, feels:12, hum:82, wind:22, f:[13,14,12,15,16,13,12]},
  newyork: {name:"New York, US", cond:"snow",    temp:-2, feels:-6, hum:70, wind:19, f:[-3,-1,0,-4,-5,-2,1]},
  cairo:   {name:"Cairo, EG",    cond:"sunny",   temp:33, feels:35, hum:20, wind:9,  f:[32,34,33,31,30,33,35]},
  paris:   {name:"Paris, FR",    cond:"cloudy",  temp:17, feels:16, hum:64, wind:12, f:[16,18,17,15,14,17,19]}
};
var CONDMETA = {
  sunny:{desc:"clear sky",theme:"day",color1:"#4facfe",color2:"#00c6ff"},
  cloudy:{desc:"overcast",theme:"day",color1:"#757f9a",color2:"#d7dde8"},
  rain:{desc:"light rain",theme:"night",color1:"#3a6073",color2:"#16222a"},
  snow:{desc:"snow showers",theme:"night",color1:"#3e5151",color2:"#decba4"}
};
var ICONS = {
  sunny:'<svg viewBox="0 0 100 100"><circle id="sun" cx="50" cy="50" r="24" fill="#ffd76a"/><g id="rays" stroke="#ffd76a" stroke-width="5" stroke-linecap="round"></g></svg>',
  cloudy:'<svg viewBox="0 0 100 100"><g id="cloudgrp"><ellipse cx="45" cy="55" rx="30" ry="18" fill="#fff"/><ellipse cx="65" cy="48" rx="20" ry="15" fill="#fff"/><ellipse cx="30" cy="50" rx="16" ry="13" fill="#fff"/></g></svg>',
  rain:'<svg viewBox="0 0 100 100"><ellipse cx="45" cy="42" rx="30" ry="18" fill="#dfe6ee"/><ellipse cx="65" cy="36" rx="18" ry="14" fill="#dfe6ee"/><g id="rain"></g></svg>',
  snow:'<svg viewBox="0 0 100 100"><ellipse cx="45" cy="42" rx="30" ry="18" fill="#eef3f7"/><ellipse cx="65" cy="36" rx="18" ry="14" fill="#eef3f7"/><g id="snow"></g></svg>'
};

var M = window.Motion;
function animate(){ if(M) M.animate.apply(null, arguments); }

function buildRays(svg){
  var g = svg.querySelector('#rays'); if(!g) return;
  for(var i=0;i<8;i++){
    var a = i*45*Math.PI/180, x1=50+30*Math.cos(a), y1=50+30*Math.sin(a), x2=50+40*Math.cos(a), y2=50+40*Math.sin(a);
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    g.appendChild(line);
  }
}
function buildDrops(svg, id, n){
  var g = svg.querySelector('#'+id); if(!g) return;
  for(var i=0;i<n;i++){
    var x = 15+Math.random()*70;
    var c = document.createElementNS('http://www.w3.org/2000/svg', id==='snow'?'circle':'line');
    if(id==='snow'){ c.setAttribute('cx',x); c.setAttribute('cy',65+Math.random()*15); c.setAttribute('r',2); c.setAttribute('fill','#fff'); }
    else { c.setAttribute('x1',x); c.setAttribute('y1',62); c.setAttribute('x2',x-3); c.setAttribute('y2',74); c.setAttribute('stroke','#bcd3e6'); c.setAttribute('stroke-width','2'); c.setAttribute('stroke-linecap','round'); }
    c.classList.add(id+'-p'); c.style.animationDelay=(Math.random()*1.5)+'s';
    g.appendChild(c);
  }
}

function renderIcon(cond){
  var host = document.getElementById('icon');
  host.innerHTML = ICONS[cond];
  var svg = host.querySelector('svg');
  if(cond==='sunny'){ buildRays(svg); animate('#sun',{scale:[1,1.08,1]},{duration:2.5,repeat:Infinity}); animate('#rays',{rotate:360},{duration:16,repeat:Infinity,easing:'linear'}); }
  if(cond==='cloudy'){ animate('#cloudgrp',{x:[0,6,0]},{duration:5,repeat:Infinity}); }
  if(cond==='rain'){ buildDrops(svg,'rain',10); animate('.rain-p',{y:[0,18],opacity:[1,0]},{duration:0.8,repeat:Infinity,delay:M?M.stagger(0.08):0}); }
  if(cond==='snow'){ buildDrops(svg,'snow',10); animate('.snow-p',{y:[0,20],x:[0,4,-4,0],opacity:[1,.6,1]},{duration:2.2,repeat:Infinity,delay:M?M.stagger(0.1):0}); }
}

function renderFX(cond){
  var host = document.getElementById('fx');
  host.innerHTML = '';
  if(cond==='rain'){
    for(var i=0;i<26;i++){
      var d=document.createElement('div'); d.className='drop';
      d.style.left=Math.random()*100+'%'; d.style.top='-10%';
      d.style.width='2px'; d.style.height=(14+Math.random()*10)+'px';
      host.appendChild(d);
      animate(d,{y:['-10%','520px']},{duration:0.6+Math.random()*0.5,repeat:Infinity,delay:Math.random()*1});
    }
  }
  if(cond==='snow'){
    for(var j=0;j<22;j++){
      var f=document.createElement('div'); f.className='flake';
      f.style.left=Math.random()*100+'%'; f.style.top='-5%';
      var s=(3+Math.random()*3)+'px'; f.style.width=s; f.style.height=s;
      host.appendChild(f);
      animate(f,{y:['-5%','520px'],x:[0,(Math.random()*40-20)]},{duration:4+Math.random()*3,repeat:Infinity,delay:Math.random()*3});
    }
  }
}

function show(key){
  var d = DATA[key]; if(!d) return;
  var meta = CONDMETA[d.cond];
  document.documentElement.setAttribute('data-theme', meta.theme==='night'?'night':'');
  document.documentElement.style.setProperty('--bg1', meta.color1);
  document.documentElement.style.setProperty('--bg2', meta.color2);
  document.getElementById('city').textContent = d.name;
  document.getElementById('date').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  document.getElementById('temp').textContent = d.temp+'°';
  document.getElementById('desc').textContent = meta.desc;
  document.getElementById('feels').textContent = d.feels+'°';
  document.getElementById('hum').textContent = d.hum+'%';
  document.getElementById('wind').textContent = d.wind+' km/h';
  renderIcon(d.cond);
  renderFX(d.cond);

  var fc = document.getElementById('forecast'); fc.innerHTML='';
  var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  d.f.forEach(function(t,i){
    var el = document.createElement('div'); el.className='fday';
    el.innerHTML = '<span>'+days[i]+'</span>'+ICONS[d.cond]+'<b>'+t+'°</b>';
    fc.appendChild(el);
  });
  animate('.card',{scale:[.97,1],opacity:[0,1]},{duration:0.5});
  animate('.fday',{opacity:[0,1],y:[16,0]},{delay:M?M.stagger(0.06):0,duration:0.4});

  document.querySelectorAll('.chips button').forEach(function(b){b.classList.toggle('active', b.dataset.key===key);});
}

function buildChips(){
  var host = document.getElementById('chips');
  Object.keys(DATA).forEach(function(k){
    var b=document.createElement('button'); b.textContent=DATA[k].name.split(',')[0]; b.dataset.key=k;
    b.addEventListener('click',function(){show(k);});
    host.appendChild(b);
  });
}

document.getElementById('go').addEventListener('click', search);
document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Enter') search(); });
function search(){
  var v = document.getElementById('q').value.trim().toLowerCase();
  var match = Object.keys(DATA).find(function(k){ return DATA[k].name.toLowerCase().indexOf(v)===0 || k===v; });
  if(match){ show(match); }
  else { document.getElementById('desc').textContent = 'city not in demo set — try one of the chips below'; }
}

buildChips();
show('riyadh');
</script>
</body>
</html>
